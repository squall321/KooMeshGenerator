name: Tests

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist

    - name: Install KooMeshGenerator
      run: |
        pip install -e .

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=koomesh --cov-report=xml --cov-report=term
      continue-on-error: true

    - name: Run CLI tests
      run: |
        pytest tests/cli/ -v --cov=koomesh.cli --cov-report=xml --cov-report=term --cov-append
      continue-on-error: false

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Install KooMeshGenerator
      run: |
        pip install -e .

    - name: Run integration tests
      run: |
        pytest tests/cli/test_integration.py -v -m integration
      continue-on-error: true

    - name: Test CLI commands
      run: |
        python -m koomesh.cli.main --version
        python -m koomesh.cli.main info
        python -m koomesh.cli.main --help

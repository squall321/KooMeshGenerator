name: Lint

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-lint-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-lint-

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 koomesh --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 koomesh --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: |
        black --check --diff koomesh tests examples
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff koomesh tests examples
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy koomesh --ignore-missing-imports --no-strict-optional
      continue-on-error: true

    - name: Lint with pylint
      run: |
        pylint koomesh --disable=C,R --max-line-length=120
      continue-on-error: true

[metadata]
name = koomesh
version = 0.1.0
author = KooMesh Team
author_email = koomesh@example.com
description = Automated mesh generator for LS-DYNA FEA simulations
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/KooMeshGenerator
project_urls =
    Bug Tracker = https://github.com/yourusername/KooMeshGenerator/issues
    Documentation = https://koomeshgenerator.readthedocs.io
    Source Code = https://github.com/yourusername/KooMeshGenerator
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Physics
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.20.0
    scipy>=1.7.0
    click>=8.0.0
    pyyaml>=5.4.0

[options.packages.find]
exclude =
    tests*
    docs*
    examples*
    build*

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=3.0.0
    black>=22.0.0
    flake8>=4.0.0
    isort>=5.10.0
    mypy>=0.950
    pre-commit>=2.17.0
    bandit>=1.7.0
    safety>=2.0.0
docs =
    sphinx>=4.5.0
    sphinx_rtd_theme>=1.0.0
    myst-parser>=0.18.0
cad =
    pythonocc-core>=7.5.0
mesh =
    gmsh>=4.9.0
all =
    pythonocc-core>=7.5.0
    gmsh>=4.9.0

[options.entry_points]
console_scripts =
    koomesh = koomesh.cli.main:main

[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    venv,
    env,
    .tox,
    .pytest_cache,
    .mypy_cache
per-file-ignores =
    __init__.py:F401,F403
max-complexity = 10

[pylint]
max-line-length = 100
disable =
    C0111,  # missing-docstring
    C0103,  # invalid-name
    R0903,  # too-few-public-methods
    R0913,  # too-many-arguments
    R0914,  # too-many-locals
    W0212,  # protected-access

[pylint.MASTER]
ignore = CVS
persistent = yes
load-plugins =

[pylint.MESSAGES CONTROL]
confidence =

[bandit]
exclude_dirs = /tests/,/test_*.py
skips = B101,B601

[tool:pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=koomesh
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests

[coverage:run]
source = koomesh
omit =
    */tests/*
    */test_*.py
    */__init__.py
    */cli/main.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
precision = 2

[coverage:html]
directory = htmlcov

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_optional = True

[mypy-OCC.*]
ignore_missing_imports = True

[mypy-gmsh.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip_glob = */migrations/*,*/__pycache__/*

[bdist_wheel]
universal = 0
